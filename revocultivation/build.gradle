repositories {
    maven { url = 'https://maven.terraformersmc.com/releases' }
    maven { url = 'https://api.modrinth.com/maven' }
}
dependencies {
    compileOnly 'dev.emi:emi-neoforge:1.1.24+1.21.1:api'
    compileOnly 'maven.modrinth:jade:eYz2YBGT'
}

if (providers.gradleProperty('revoShoesTests').isPresent()) {
    sourceSets.main.java.srcDir 'src/shoetest/java'
    sourceSets.main.resources.srcDir 'src/gametest/resources'
    dependencies { runtimeOnly files(rootProject.file('.local/integration-mods/Modern-Industrialization-2.5.11.jar'),rootProject.file('.local/integration-mods/ironfurnaces-neoforge-1.21.1-4.3.2.jar'),rootProject.file('.local/integration-mods/guideme-21.1.22.jar')) }
    neoForge {
        mods { revoindustry { sourceSet project(':revoindustry').sourceSets.main } }
        runs { shoesTests { type='gameTestServer'; systemProperty 'neoforge.enabledGameTestNamespaces','revocultivation' } }
    }
}
tasks.named('jar', Jar) { exclude '**/RunningShoesGameTests*' }
if (providers.gradleProperty('revoFarmTests').isPresent()) {
    sourceSets.main.java.srcDir 'src/gametest/java'
    sourceSets.main.resources.srcDir 'src/gametest/resources'
    neoForge {
        mods { revogenetics { sourceSet project(':revogenetics').sourceSets.main } }
        runs { farmTests { type = 'gameTestServer'; systemProperty 'neoforge.enabledGameTestNamespaces', 'revocultivation' } }
    }
}
if (providers.gradleProperty('revoFarmUiQa').isPresent()) { sourceSets.main.java.srcDir 'src/uiqa/java' }
if (providers.gradleProperty('revoSmallUiQa').isPresent()) { sourceSets.main.java.srcDir 'src/smallqa/java' }
tasks.named('jar', Jar) { exclude '**/FarmGameTests*', '**/SmallGameTests*', '**/FarmUiQa*', '**/SmallUiQa*', 'data/revocultivation/structure/farm_test.nbt' }

if (providers.gradleProperty('revoFarmLightingTests').isPresent()) {
    sourceSets.main.java.srcDir 'src/lightingtest/java'
    sourceSets.main.resources.srcDir 'src/gametest/resources'
    neoForge {
        mods {
            revolib { sourceSet project(':revolib').sourceSets.main }
            revoindustry { sourceSet project(':revoindustry').sourceSets.main }
        }
        runs { farmLightingTests { type = 'gameTestServer'; systemProperty 'neoforge.enabledGameTestNamespaces', 'revocultivation' } }
    }
}
tasks.named('jar', Jar) { exclude '**/FarmLightingGameTests*' }

if (providers.gradleProperty('revoFarmLightingTests').isPresent()) {
 dependencies { runtimeOnly files(rootProject.file('.local/integration-mods/Modern-Industrialization-2.5.11.jar'),rootProject.file('.local/integration-mods/ironfurnaces-neoforge-1.21.1-4.3.2.jar'),rootProject.file('.local/integration-mods/guideme-21.1.22.jar')) }
}

if (providers.gradleProperty('revoCultivationPerformanceTests').isPresent()) {
 sourceSets.main.java.srcDir 'src/gametest/java'
 sourceSets.main.java.srcDir 'src/lightingtest/java'
 sourceSets.main.resources.srcDir 'src/gametest/resources'
 dependencies { runtimeOnly files(rootProject.file('.local/integration-mods/Modern-Industrialization-2.5.11.jar'),rootProject.file('.local/integration-mods/ironfurnaces-neoforge-1.21.1-4.3.2.jar'),rootProject.file('.local/integration-mods/guideme-21.1.22.jar')) }
 neoForge {
  mods {
   revolib { sourceSet project(':revolib').sourceSets.main }
   revogenetics { sourceSet project(':revogenetics').sourceSets.main }
   revoindustry { sourceSet project(':revoindustry').sourceSets.main }
  }
  runs { cultivationPerformanceTests { type='gameTestServer'; systemProperty 'neoforge.enabledGameTestNamespaces','revocultivation' } }
 }
}
