repositories {
 maven { url = 'https://maven.ftb.dev/releases' }
 maven { url = 'https://maven.terraformersmc.com/releases' }
 maven { url = 'https://api.modrinth.com/maven' }
}
dependencies {
 compileOnly('dev.ftb.mods:ftb-quests-neoforge:2101.1.37') { transitive = false }
 compileOnly('dev.ftb.mods:ftb-library-neoforge:2101.1.39') { transitive = false }
 compileOnly('dev.ftb.mods:ftb-teams-neoforge:2101.1.11') { transitive = false }
 compileOnly 'dev.emi:emi-neoforge:1.1.24+1.21.1:api'
 compileOnly 'maven.modrinth:jade:eYz2YBGT'
}
if (providers.gradleProperty('revoChapterUiQa').isPresent()) { sourceSets.main.java.srcDir 'src/chapterqa/java' }
tasks.named('jar', Jar) { exclude '**/ChapterOneUiQa*', '**/IndustrialGridUiQa*' }

repositories { maven { url='https://modmaven.dev' }; mavenCentral() }
dependencies {
 compileOnly('maven.modrinth:modern-industrialization:hN58r67E') { transitive=false }
 compileOnly('maven.modrinth:iron-furnaces:WZ25JeYB') { transitive=false }
 compileOnly('dev.technici4n:GrandPower:3.0.0') { transitive=false }
 compileOnly 'org.jspecify:jspecify:1.0.0'
}

if (providers.gradleProperty('revoFurnaceTests').isPresent()) {
 sourceSets.main.java.srcDir 'src/furnacetest/java'
 sourceSets.main.resources.srcDir 'src/furnacetest/resources'
 dependencies { runtimeOnly files(rootProject.file('.local/integration-mods/Modern-Industrialization-2.5.11.jar'),rootProject.file('.local/integration-mods/ironfurnaces-neoforge-1.21.1-4.3.2.jar'),rootProject.file('.local/integration-mods/guideme-21.1.22.jar')) }
 neoForge { mods { revolib { sourceSet project(':revolib').sourceSets.main } }
  runs { furnaceTests { type='gameTestServer'; systemProperty 'neoforge.enabledGameTestNamespaces','revoindustry' } }
 }
}
tasks.named('jar', Jar) { exclude '**/FurnaceGameTests*','data/revoindustry/structure/furnace_test.nbt' }

if (providers.gradleProperty('revoFurnaceUiQa').isPresent()) { sourceSets.main.java.srcDir 'src/furnaceuiqa/java' }
tasks.named('jar', Jar) { exclude '**/FurnaceUiQa*' }

if (providers.gradleProperty('revoVacuumTests').isPresent()) {
 sourceSets.main.java.srcDir 'src/vacuumtest/java'
 sourceSets.main.resources.srcDir 'src/vacuumtest/resources'
 dependencies { runtimeOnly files(rootProject.file('.local/integration-mods/Modern-Industrialization-2.5.11.jar'),rootProject.file('.local/integration-mods/ironfurnaces-neoforge-1.21.1-4.3.2.jar'),rootProject.file('.local/integration-mods/guideme-21.1.22.jar')) }
 neoForge { mods { revolib { sourceSet project(':revolib').sourceSets.main } }
  runs { vacuumTests { type='gameTestServer'; systemProperty 'neoforge.enabledGameTestNamespaces','revoindustry' } }
 }
}
if (providers.gradleProperty('revoVacuumUiQa').isPresent()) { sourceSets.main.java.srcDir 'src/vacuumuiqa/java' }
tasks.named('jar', Jar) { exclude '**/VacuumGameTests*','**/VacuumUiQa*','data/revoindustry/structure/vacuum_test.nbt' }

if (providers.gradleProperty('revoHatcheryTests').isPresent()) {
 sourceSets.main.java.srcDir 'src/hatcherytest/java'
 sourceSets.main.resources.srcDir 'src/hatcherytest/resources'
 dependencies { runtimeOnly files(rootProject.file('.local/integration-mods/Modern-Industrialization-2.5.11.jar'),rootProject.file('.local/integration-mods/ironfurnaces-neoforge-1.21.1-4.3.2.jar'),rootProject.file('.local/integration-mods/guideme-21.1.22.jar')) }
 neoForge {
  mods { revolib { sourceSet project(':revolib').sourceSets.main } }
  runs { hatcheryTests { type='gameTestServer'; systemProperty 'neoforge.enabledGameTestNamespaces','revoindustry' } }
 }
}
tasks.named('jar', Jar) { exclude '**/HatcheryGameTests*','data/revoindustry/structure/hatchery_test.nbt' }

if (providers.gradleProperty('revoHatcheryUiQa').isPresent()) {
 sourceSets.main.java.srcDir 'src/hatcheryuiqa/java'
 dependencies { runtimeOnly files(rootProject.file('.local/integration-mods/Modern-Industrialization-2.5.11.jar'),rootProject.file('.local/integration-mods/ironfurnaces-neoforge-1.21.1-4.3.2.jar'),rootProject.file('.local/integration-mods/guideme-21.1.22.jar')) }
 neoForge {
  mods { revolib { sourceSet project(':revolib').sourceSets.main } }
  runs { hatcheryUiQa { client(); programArguments.addAll '--width', '1440', '--height', '1000' } }
 }
}
tasks.named('jar', Jar) { exclude '**/HatcheryUiQa*' }

if (providers.gradleProperty('revoSalternTests').isPresent()) {
 sourceSets.main.java.srcDir 'src/salterntest/java'
 sourceSets.main.resources.srcDir 'src/salterntest/resources'
 dependencies { runtimeOnly files(rootProject.file('.local/integration-mods/Modern-Industrialization-2.5.11.jar'),rootProject.file('.local/integration-mods/ironfurnaces-neoforge-1.21.1-4.3.2.jar'),rootProject.file('.local/integration-mods/guideme-21.1.22.jar')) }
 neoForge { mods { revolib { sourceSet project(':revolib').sourceSets.main } }
  runs { salternTests { type='gameTestServer'; systemProperty 'neoforge.enabledGameTestNamespaces','revoindustry' } }
 }
}
tasks.named('jar', Jar) { exclude '**/SalternGameTests*','data/revoindustry/structure/saltern_test.nbt' }

if (providers.gradleProperty('revoSalternUiQa').isPresent()) {
 sourceSets.main.java.srcDir 'src/salternuiqa/java'
 dependencies { runtimeOnly files(rootProject.file('.local/integration-mods/Modern-Industrialization-2.5.11.jar'),rootProject.file('.local/integration-mods/ironfurnaces-neoforge-1.21.1-4.3.2.jar'),rootProject.file('.local/integration-mods/guideme-21.1.22.jar')) }
 neoForge { mods { revolib { sourceSet project(':revolib').sourceSets.main } }
  runs { salternUiQa { client(); programArguments.addAll '--width','1440','--height','1000' } }
 }
}
tasks.named('jar', Jar) { exclude '**/SalternUiQa*' }

// Combined regression run without adding the shared RevoLib source set repeatedly.
if (providers.gradleProperty('revoIndustryPerformanceTests').isPresent()) {
 ['furnacetest','vacuumtest','hatcherytest','salterntest'].each { name ->
  sourceSets.main.java.srcDir "src/${name}/java"
  sourceSets.main.resources.srcDir "src/${name}/resources"
 }
 dependencies { runtimeOnly files(rootProject.file('.local/integration-mods/Modern-Industrialization-2.5.11.jar'),rootProject.file('.local/integration-mods/ironfurnaces-neoforge-1.21.1-4.3.2.jar'),rootProject.file('.local/integration-mods/guideme-21.1.22.jar')) }
 neoForge {
  mods { revolib { sourceSet project(':revolib').sourceSets.main } }
  runs { industryPerformanceTests { type='gameTestServer'; systemProperty 'neoforge.enabledGameTestNamespaces','revoindustry' } }
 }
}
